version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: notewise_db
    restart: always

    env_file:
      - ./backend/.env   

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: notewise_backend
    restart: always

    env_file:
      - ./backend/.env   

    ports:
      - "8080:8080"

    depends_on:
      - postgres

volumes:
  postgres_data: